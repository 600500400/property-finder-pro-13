<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Radar Scanning Waves (top-right corner radiating outwards) -->
  <g filter="url(#glow)">
    <!-- Outer wave -->
    <path d="M 320 120 A 150 150 0 0 1 425 225" fill="none" stroke="#10B981" stroke-width="20" stroke-linecap="round" opacity="0.45"/>
    <!-- Middle wave -->
    <path d="M 295 145 A 110 110 0 0 1 390 240" fill="none" stroke="#34D399" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
    <!-- Inner wave -->
    <path d="M 270 170 A 70 70 0 0 1 355 255" fill="none" stroke="#6EE7B7" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Modern Geometric House -->
  <!-- Roof -->
  <path d="M 120 270 L 256 160 L 320 212" fill="none" stroke="url(#houseGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- House Body -->
  <path d="M 152 265 L 152 400 C 152 406 156 410 162 410 L 350 410 C 356 410 360 406 360 400 L 360 265" fill="none" stroke="url(#houseGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Investment Accent inside House (Pulse / Bar Chart) -->
  <rect x="200" y="330" width="24" height="50" rx="6" fill="#334155"/>
  <rect x="244" y="295" width="24" height="85" rx="6" fill="#334155"/>
  <rect x="288" y="260" width="24" height="120" rx="6" fill="url(#emeraldGrad)" filter="url(#glow)"/>
</svg>
